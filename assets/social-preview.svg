<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Unjiggle — see your home screen clearly</title>
  <desc id="desc">Unjiggle CLI illustration with a sample home screen score and swipe estimate</desc>
